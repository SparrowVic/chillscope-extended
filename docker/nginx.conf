map $uri $chillscope_cache_control {
  default "no-cache";
  "~*^/.+-[a-z0-9]{8}\.(?:css|js|woff|woff2)$" "public, max-age=31536000, immutable";
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/plain;

  add_header Cache-Control $chillscope_cache_control always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /manifest.webmanifest {
    types {
      application/manifest+json webmanifest;
    }
    try_files $uri =404;
  }

  # A file-like request must remain a 404. Returning the SPA shell here would hide broken assets.
  location ~ /[^/]+\.[^/]+$ {
    try_files $uri =404;
  }

  location ~ ^/(?:assets|icons|media)/ {
    try_files $uri =404;
  }

  # Angular owns client-side routes; direct navigation and refresh therefore fall back to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
