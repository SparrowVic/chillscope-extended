<span id="language-switch-label" class="sr-only">{{ 'language.label' | transloco }}</span>

<span class="cs-segment" role="group" aria-labelledby="language-switch-label">
  @for (option of options; track option.value) {
    <button
      class="cs-segment__option language-switch__option cs-mono cs-focus-ring"
      type="button"
      [class.cs-segment__option--selected]="language() === option.value"
      [attr.aria-label]="option.labelKey | transloco"
      [attr.aria-pressed]="language() === option.value"
      (click)="select(option.value)"
    >
      {{ option.codeKey | transloco }}
    </button>
  }
</span>
