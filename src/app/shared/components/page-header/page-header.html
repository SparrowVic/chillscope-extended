@if (icon(); as iconName) {
  <span class="page-header__icon" aria-hidden="true"><cs-icon [name]="iconName" /></span>
}

<div class="page-header__text">
  <h1 class="page-header__title">{{ titleKey() | transloco }}</h1>
  @if (subtitleKey(); as subtitle) {
    <p class="page-header__subtitle">{{ subtitle | transloco }}</p>
  }
</div>

<div class="page-header__actions">
  <ng-content />
</div>
